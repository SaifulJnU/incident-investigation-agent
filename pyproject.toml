[project]
name = "incident-investigation-agent"
version = "0.1.0"
description = "Incident investigation agent on the Strands Agents SDK. Amazon Bedrock in production, Ollama locally."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "strands-agents[ollama]>=1.0.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
investigate = "incident_investigation_agent.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/incident_investigation_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
