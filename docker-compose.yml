# Local production shape. The database password is for this compose file only.
# In production, set DATABASE_URL from a secret and point MODEL_PROVIDER at bedrock.

services:
  floci:
    image: floci/floci:latest
    ports:
      - "4566:4566"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - floci-data:/app/data
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: investigator
      POSTGRES_PASSWORD: investigator
      POSTGRES_DB: investigations
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investigator -d investigations"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    environment: &app-env
      DATABASE_URL: postgresql+psycopg://investigator:investigator@postgres:5432/investigations
      # Local compose always uses Ollama. A host MODEL_PROVIDER=bedrock must not leak in.
      MODEL_PROVIDER: ollama
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-global.anthropic.claude-sonnet-4-6}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      # Floci stands in for CloudWatch. Leave AWS_ENDPOINT_URL empty for real AWS.
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-http://floci:4566}
      CLOUDWATCH_LOG_GROUP_PREFIX: ${CLOUDWATCH_LOG_GROUP_PREFIX:-/aws/ecs/}
      LOG_DIR: /app/examples/logs
      # Local compose reads CloudWatch on Floci. Production sets APP_ENV=prod and clears AWS_ENDPOINT_URL.
      APP_ENV: local
      CONNECTORS: cloudwatch
      LOG_LEVEL: INFO
      # Local sign-in only. Production sets AUTH_MODE=oidc and does not set DEV_AUTH_SECRET.
      AUTH_MODE: dev
      DEV_AUTH_SECRET: local-dev-only-not-for-production-use
      DEV_USERS: oncall|On-call engineer|checkout-api,payments-api|oncall-local;platform|Platform owner|*|platform-local
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 25s

  worker:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    command: ["python", "-m", "incident_investigation_agent.worker"]
    environment: *app-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      floci:
        condition: service_started
      api:
        condition: service_healthy

  checkout:
    image: incident-investigation-agent-worker
    entrypoint: ["python"]
    command: ["-m", "incident_investigation_agent.demo_checkout"]
    environment:
      PYTHONPATH: /src
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_REGION: us-east-1
      CHECKOUT_LOG_GROUP: /aws/ecs/checkout-api
      CHECKOUT_PORT: "8090"
    volumes:
      - ./src:/src
    ports:
      - "8090:8090"
    depends_on:
      floci:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  floci-data:
